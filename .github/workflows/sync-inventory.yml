name: Sync Steam Inventory to D1

on:
    # 定时：每 6 小时同步一次（UTC 时间）
    schedule:
        - cron: '0 */6 * * *'

    # 手动触发（在 Actions 页面点 "Run workflow"）
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install Python deps
              run: pip install requests

            - name: Fetch inventory from Steam
              working-directory: ./pipeline
              env:
                  STEAM_ID: ${{ secrets.STEAM_ID }}
                  STEAM_LOGIN_SECURE: ${{ secrets.STEAM_LOGIN_SECURE }}
                  STEAM_SESSIONID: ${{ secrets.STEAM_SESSIONID }}
              run: python cs2_float_query.py --out inventory.json

            - name: Build D1 import SQL
              working-directory: ./pipeline
              run: python build_d1_sql.py --in inventory.json --out import.sql

            - name: Push to D1
              working-directory: ./steam-inventory-worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx --yes wrangler@4 d1 execute steam-inventory-db --remote --file=../pipeline/import.sql

            - name: Summary
              if: always()
              run: |
                  echo "### 同步完成" >> $GITHUB_STEP_SUMMARY
                  echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
                  if [ -f pipeline/inventory.json ]; then
                    echo "- inventory.json: $(du -h pipeline/inventory.json | cut -f1)" >> $GITHUB_STEP_SUMMARY
                  fi
                  if [ -f pipeline/import.sql ]; then
                    echo "- import.sql: $(du -h pipeline/import.sql | cut -f1)" >> $GITHUB_STEP_SUMMARY
                  fi
